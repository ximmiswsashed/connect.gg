<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TuffyBlud - Secure Desktop Portal">
  <title>TuffyBlud | Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========== ANIMATED BACKGROUND ========== -->
  <div class="bg-grid" aria-hidden="true">
    <div class="grid-line gl-1"></div>
    <div class="grid-line gl-2"></div>
    <div class="grid-line gl-3"></div>
    <div class="grid-line gl-4"></div>
    <div class="grid-line gl-5"></div>
    <div class="grid-line gl-6"></div>
    <div class="grid-line gl-7"></div>
    <div class="grid-line gl-8"></div>
  </div>

  <div class="floating-shapes" aria-hidden="true">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
    <div class="shape shape-5"></div>
  </div>

  <!-- ========== LOGIN PAGE ========== -->
  <section id="login-page" class="page active">
    <div class="login-container">
      <div class="login-card">
        <!-- Logo / Branding -->
        <div class="brand">
          <div class="brand-icon">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
              <rect x="4" y="4" width="40" height="40" rx="12" stroke="currentColor" stroke-width="2.5"/>
              <circle cx="24" cy="24" r="8" stroke="currentColor" stroke-width="2.5"/>
              <line x1="24" y1="4" x2="24" y2="16" stroke="currentColor" stroke-width="2"/>
              <line x1="24" y1="32" x2="24" y2="44" stroke="currentColor" stroke-width="2"/>
              <line x1="4" y1="24" x2="16" y2="24" stroke="currentColor" stroke-width="2"/>
              <line x1="32" y1="24" x2="44" y2="24" stroke="currentColor" stroke-width="2"/>
            </svg>
          </div>
          <h1 class="brand-name">TuffyBlud</h1>
          <p class="brand-tagline">Secure Desktop Portal</p>
        </div>

        <!-- Divider -->
        <div class="divider">
          <span class="divider-line"></span>
          <span class="divider-text">Sign In</span>
          <span class="divider-line"></span>
        </div>

        <!-- Login Form -->
        <form id="login-form" autocomplete="off">
          <div class="input-group" id="input-group-user">
            <label for="username">Username</label>
            <div class="input-wrapper">
              <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <input type="text" id="username" placeholder="Enter username" required>
              <div class="input-focus-ring"></div>
            </div>
          </div>

          <div class="input-group" id="input-group-pass">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="password" id="password" placeholder="Enter password" required>
              <div class="input-focus-ring"></div>
            </div>
          </div>

          <div id="error-msg" class="error-message" role="alert"></div>

          <button type="submit" id="login-btn" class="btn-login">
            <span class="btn-text">Access Portal</span>
            <span class="btn-loader" aria-hidden="true">
              <span class="loader-dot"></span>
              <span class="loader-dot"></span>
              <span class="loader-dot"></span>
            </span>
            <svg class="btn-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>
        </form>

        <!-- Footer -->
        <p class="login-footer">Protected access &mdash; authorized users only</p>
      </div>
    </div>
  </section>

  <!-- ========== DASHBOARD PAGE ========== -->
  <section id="dashboard-page" class="page">
    <header class="dash-header">
      <div class="dash-header-inner">
        <div class="dash-brand">
          <svg width="32" height="32" viewBox="0 0 48 48" fill="none">
            <rect x="4" y="4" width="40" height="40" rx="12" stroke="currentColor" stroke-width="2.5"/>
            <circle cx="24" cy="24" r="8" stroke="currentColor" stroke-width="2.5"/>
          </svg>
          <span>TuffyBlud</span>
        </div>
        <button id="logout-btn" class="btn-logout" title="Sign out">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          <span>Sign Out</span>
        </button>
      </div>
    </header>

    <main class="dash-main">
      <div class="dash-welcome">
        <h2 class="dash-title">
          <span class="dash-greeting">Welcome back,</span>
          <span class="dash-username">tuffyblud</span>
        </h2>
        <p class="dash-subtitle">Select a desktop environment to continue.</p>
      </div>

      <div class="desktop-grid">
        <!-- Desktop 1 -->
        <button class="desktop-card" id="desktop-1-btn" onclick="handleDesktopClick(1)">
          <div class="card-glow"></div>
          <div class="card-content">
            <div class="card-icon">
              <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                <line x1="8" y1="21" x2="16" y2="21"/>
                <line x1="12" y1="17" x2="12" y2="21"/>
              </svg>
            </div>
            <h3 class="card-title">Desktop 1</h3>
            <p class="card-desc">Primary workspace environment</p>
            <div class="card-status">
              <span class="status-dot"></span>
              <span>Available</span>
            </div>
          </div>
          <div class="card-arrow">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </div>
        </button>

        <!-- Desktop 2 -->
        <button class="desktop-card" id="desktop-2-btn" onclick="handleDesktopClick(2)">
          <div class="card-glow"></div>
          <div class="card-content">
            <div class="card-icon">
              <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                <line x1="8" y1="21" x2="16" y2="21"/>
                <line x1="12" y1="17" x2="12" y2="21"/>
              </svg>
            </div>
            <h3 class="card-title">Desktop 2</h3>
            <p class="card-desc">Secondary workspace environment</p>
            <div class="card-status">
              <span class="status-dot"></span>
              <span>Available</span>
            </div>
          </div>
          <div class="card-arrow">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </div>
        </button>
      </div>
    </main>

    <footer class="dash-footer">
      <p>&copy; 2026 TuffyBlud Portal &mdash; All rights reserved</p>
    </footer>
  </section>

  <!-- ========== REMOTE DESKTOP OVERLAY ========== -->
  <div id="rdp-overlay" class="rdp-overlay">
    <div class="rdp-header">
      <div class="rdp-brand">
        <span class="status-dot rdp-status"></span>
        <span id="rdp-title">Connecting to Desktop...</span>
      </div>
      <div class="rdp-actions">
        <button id="rdp-fullscreen-btn" class="rdp-btn" title="Toggle Fullscreen">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
        <button id="rdp-close-btn" class="rdp-btn close" title="Disconnect">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="rdp-frame-container">
      <!-- We load the RustDesk web client here -->
      <iframe id="rdp-frame" src="about:blank" frameborder="0" allow="clipboard-read; clipboard-write"></iframe>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
